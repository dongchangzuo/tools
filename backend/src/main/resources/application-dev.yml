server:
  port: 8000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tools_auth
    username: tools
    password: tools_secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  mail:
    mock: true
    mock-base-url: http://localhost:8080

logging:
  level:
    com.tools.auth.service.EmailService: INFO
