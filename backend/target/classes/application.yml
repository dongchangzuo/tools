spring:
  application:
    name: tools-auth-api
  profiles:
    active: dev

server:
  port: 8080

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars!!}
    reset-secret: ${JWT_RESET_SECRET:change-me-reset-secret-at-least-32-chars!!}
    access-expiration-seconds: 3600
    remember-expiration-seconds: 604800
    reset-expiration-seconds: 900
  reset-code:
    expiration-minutes: 10
